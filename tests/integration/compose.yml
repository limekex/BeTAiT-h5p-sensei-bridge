# Isolated test services. No host ports or production data mounts.
services:
  db:
    image: mariadb:10.11.18
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: fixture-only
      MARIADB_ROOT_PASSWORD: fixture-root-only
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 40
  wordpress:
    image: ${FKHS_WP_IMAGE:-wordpress:7.0.0-php8.2-apache}
    depends_on:
      db:
        condition: service_healthy
    environment: &wp_environment
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: fixture-only
      WORDPRESS_CONFIG_EXTRA: "define('FKHS_INTEGRATION_TESTS', true);"
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - site:/var/www/html
      - ../../h5p-sensei-bridge:/var/www/html/wp-content/plugins/h5p-sensei-bridge:ro
      - ./disable-mail.php:/var/www/html/wp-content/mu-plugins/fkhs-fixture.php:ro
  cli:
    image: ${FKHS_CLI_IMAGE:-wordpress:cli-2.12.0-php8.2}
    profiles: [tools]
    user: '33:33'
    environment: *wp_environment
    volumes:
      - site:/var/www/html
      - ../../h5p-sensei-bridge:/var/www/html/wp-content/plugins/h5p-sensei-bridge:ro
      - ./disable-mail.php:/var/www/html/wp-content/mu-plugins/fkhs-fixture.php:ro
      - ..:/tests:ro
volumes:
  site:
